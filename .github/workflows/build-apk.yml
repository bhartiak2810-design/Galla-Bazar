name: Build Android WebView Debug APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare clearly labeled debug artifact
        run: |
          apk_name="Galla_Bazar_WebView_Debug_${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk_name"
          sha256sum "$apk_name" > "$apk_name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Galla-Bazar-WebView-Debug-${{ github.sha }}
          path: Galla_Bazar_WebView_Debug_*
          retention-days: 14
