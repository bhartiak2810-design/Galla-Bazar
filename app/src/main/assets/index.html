<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f3f"><title>Galla Bazar</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f8f5;color:#173d28}header{background:#087f3f;color:#fff;padding:14px 18px;position:sticky;top:0;z-index:5}.brand{font-size:24px;font-weight:800}.sub{font-size:12px;opacity:.9}.wrap{max-width:720px;margin:auto;padding:14px 14px 90px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;z-index:9}nav button{border:0;background:none;padding:10px 5px;font-size:12px;color:#486}nav button b{display:block;font-size:20px}.card{background:#fff;border:1px solid #dce8df;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;background:#087f3f;color:#fff;margin-top:8px}.btn.alt{background:#f0ad00;color:#1b1b1b}.btn.gray{background:#e9efeb;color:#173d28}.btn.red{background:#b3261e}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd8cf;border-radius:11px;margin:6px 0 10px;background:#fff;font-size:16px}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}.price{font-size:20px;font-weight:800}.muted{color:#65746a}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#e5f6ea;color:#087f3f;font-weight:700;font-size:12px}.ok{background:#eaf8ef;border-left:4px solid #087f3f;padding:10px;border-radius:8px}.warn{background:#fff6dc;border-left:4px solid #f0ad00;padding:10px;border-radius:8px}.kpi{font-size:25px;font-weight:900}
</style></head><body><header><div class="brand">🌾 Galla Bazar</div><div class="sub">Nutrigrain.in • Farm to Home</div></header><div class="wrap" id="app"></div><nav><button onclick="show('home')"><b>⌂</b>Home</button><button onclick="show('shop')"><b>🌾</b>Shop</button><button onclick="show('cart')"><b>🛒</b>Cart</button><button onclick="show('orders')"><b>📦</b>Orders</button></nav><script>
const app=document.getElementById('app');const products=[['गेहूं',26,'kg'],['चना',60,'kg'],['जौ',28,'kg'],['मसूर',75,'kg'],['सरसों',62,'kg'],['चक्की आटा',42,'kg'],['चना आटा / बेसन',85,'kg'],['सरसों तेल',225,'L']];
let cart=JSON.parse(localStorage.getItem('gb_cart')||'[]'),orders=JSON.parse(localStorage.getItem('gb_orders')||'[]');const save=()=>{localStorage.setItem('gb_cart',JSON.stringify(cart));localStorage.setItem('gb_orders',JSON.stringify(orders))};const money=n=>'₹'+Math.round(Number(n||0));function show(p){({home,shop,cartPage,checkout,ordersPage}[p==='cart'?'cartPage':p==='orders'?'ordersPage':p]||home)();scrollTo(0,0)}
function home(){app.innerHTML='<div class="card"><span class="pill">Galla Bazar App</span><h2>घर तक अनाज, आटा और तेल</h2><p class="muted">Cart, checkout, COD order और tracking ready.</p><button class="btn" onclick="show(\'shop\')">अभी खरीदें</button></div><div class="card"><h3>📍 Delivery Location</h3><p>अपना पूरा पता Checkout में भरें या GPS location जोड़ें।</p></div>'}
function shop(){app.innerHTML='<div class="card"><h2>🌾 Products</h2>'+products.map((p,i)=>'<div class="item"><div><b>'+p[0]+'</b><br><span class="price">'+money(p[1])+'/'+p[2]+'</span></div><button class="btn" style="width:auto" onclick="add('+i+')">Cart में जोड़ें</button></div>').join('')+'<button class="btn alt" onclick="show(\'cart\')">🛒 Cart ('+cart.length+')</button></div>'}
function add(i){const p=products[i],q=Number(prompt('कितने '+p[2]+'?','1'));if(!q||q<=0)return;cart.push({name:p[0],qty:q,rate:p[1],unit:p[2],total:q*p[1]});save();cartPage()}
function cartPage(){const total=cart.reduce((a,x)=>a+x.total,0);app.innerHTML='<div class="card"><h2>🛒 आपका Cart</h2>'+(cart.length?cart.map((x,i)=>'<div class="item"><div><b>'+x.name+'</b><br><span class="muted">'+x.qty+' '+x.unit+' × '+money(x.rate)+'</span></div><div><b>'+money(x.total)+'</b><br><button class="btn red" style="width:auto;padding:7px" onclick="removeItem('+i+')">हटाएँ</button></div></div>').join(''):'<p>Cart खाली है</p>')+'<h3>कुल: '+money(total)+'</h3><button class="btn" '+(cart.length?'':'disabled')+' onclick="show(\'checkout\')">Checkout</button><button class="btn gray" onclick="show(\'shop\')">और खरीदें</button></div>'}
function removeItem(i){cart.splice(i,1);save();cartPage()}
function checkout(){if(!cart.length)return show('shop');const sub=cart.reduce((a,x)=>a+x.total,0),del=sub>=999?0:50,total=sub+del;app.innerHTML='<div class="card"><h2>Checkout</h2><div class="ok">सामान: <b>'+money(sub)+'</b><br>Delivery: <b>'+(del?money(del):'FREE')+'</b><br>कुल: <b>'+money(total)+'</b></div><input id="name" placeholder="Customer नाम"><input id="phone" inputmode="numeric" maxlength="10" placeholder="10 अंकों का मोबाइल"><textarea id="addr" rows="4" placeholder="पूरा delivery address"></textarea><button class="btn gray" onclick="locate()">📍 GPS Location</button><select id="pay"><option>Cash on Delivery (COD)</option></select><button class="btn" onclick="place()">Order Confirm करें</button><button class="btn gray" onclick="show(\'cart\')">← Cart</button></div>'}
function locate(){navigator.geolocation.getCurrentPosition(p=>{document.getElementById('addr').value='Location: '+p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5)},()=>alert('Location permission नहीं मिली; address manually भरें।'))}
function place(){const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),addr=document.getElementById('addr').value.trim();if(!name||!addr||!/^[6-9]\d{9}$/.test(phone))return alert('नाम, सही मोबाइल और पूरा पता भरें');const sub=cart.reduce((a,x)=>a+x.total,0),del=sub>=999?0:50,total=sub+del,id='GB'+Date.now().toString().slice(-8);orders.unshift({id,name,phone,addr,total,status:'Order Received',date:new Date().toLocaleString('hi-IN'),items:[...cart]});cart=[];save();app.innerHTML='<div class="card" style="text-align:center"><div style="font-size:54px">✅</div><h2>Order Confirm हो गया</h2><p>Order ID</p><div class="kpi">'+id+'</div><p><b>'+money(total)+'</b> • COD</p><button class="btn" onclick="track(\''+id+'\')">🚚 Track Order</button><button class="btn gray" onclick="show(\'orders\')">My Orders</button></div>'}
function ordersPage(){app.innerHTML='<div class="card"><h2>📦 My Orders</h2>'+(orders.length?orders.map(o=>'<div class="card"><span class="pill">'+o.status+'</span><h3>'+o.id+'</h3><p>'+money(o.total)+' • COD</p><p class="muted">'+o.date+'</p><button class="btn" onclick="track(\''+o.id+'\')">Track</button></div>').join(''):'<p>अभी कोई order नहीं है।</p>')+'</div>'}
function track(id){const o=orders.find(x=>x.id===id);app.innerHTML='<div class="card"><h2>🚚 Order Tracking</h2><h3>'+id+'</h3><div class="ok">✓ '+(o?o.status:'Order Received')+'</div><p>↓</p><div class="warn">Processing → Packed → Out for Delivery → Delivered</div><button class="btn gray" onclick="show(\'orders\')">My Orders</button></div>'}
home();
</script></body></html>
